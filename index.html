<script>
// ... نفس الكود القديم بس استبدل الجزء الأخير بهذا:
let clicks=0;
function openAdmin(){
 let pass=prompt('🔐 لوحة تحكم OLIVER MARSHAL - أدخل كلمة السر:');
 if(pass==='OLIVER2026' || pass==='oliver' || pass==='' || pass===null){
  document.getElementById('home').style.display='none';
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('admin').style.display='block';
 }else{alert('كلمة السر خطأ! جرب: OLIVER2026');}
}
// طريقة 1: 3 ضغطات على العنوان
document.querySelector('.big-title').addEventListener('click',()=>{
 clicks++; if(clicks>=3){openAdmin(); clicks=0} setTimeout(()=>clicks=0,2000);
});
// طريقة 2: ضغطة طويلة على النجمة
let pressTimer;
document.getElementById('secretStar').addEventListener('touchstart',()=>{pressTimer=setTimeout(openAdmin,800)});
document.getElementById('secretStar').addEventListener('touchend',()=>clearTimeout(pressTimer));
document.getElementById('secretStar').addEventListener('click',()=>{
 clicks++; if(clicks>=5){openAdmin(); clicks=0}
});
// طريقة 3: رابط مباشر ?admin
if(window.location.search.includes('admin') || window.location.hash.includes('admin')){setTimeout(openAdmin,500)}
</script>
