<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLANO POLICE - سهل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#050a1f;color:#fff}
.wrap{max-width:720px;margin:20px auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(18,28,62,.92),rgba(10,16,34,.92));border:1px solid rgba(255,255,255,.1);border-radius:14px;margin-bottom:8px;cursor:pointer}
.card-inner{padding:14px}.page{display:none}.back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:8px;margin-bottom:10px;cursor:pointer}
.input{width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:9px;color:#fff;margin-top:5px}
.btn{width:100%;background:#2d6bff;border:none;border-radius:10px;padding:11px;color:#fff;font-weight:800;margin-top:8px;cursor:pointer}
.btnGold{background:linear-gradient(90deg,#c9a86a,#8c6d3a);color:#000}
.law-num{background:linear-gradient(135deg,#c9a86a,#8c6d3a);color:#000;font-weight:900;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;font-size:13px}
#entrance{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:.8s;background-size:cover;background-position:center}
#entrance::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(5,10,31,.4),rgba(5,10,31,.85));z-index:1}
#entrance>*{position:relative;z-index:2}
.badge{width:110px;height:110px;background:linear-gradient(180deg,#c9a86a,#8c6d3a);border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.badge b{font-size:44px;color:#000}.badge span{font-size:8px;letter-spacing:2px;color:#000;font-weight:900}
.title{font-size:40px;font-weight:900;margin-top:12px;text-shadow:0 2px 10px #000}
.sub{letter-spacing:5px;font-size:11px;color:#c9a86a}
.owner{font-size:11px;color:#fff;text-align:center;margin-top:10px}
.enterBtn{margin-top:18px;background:linear-gradient(90deg,#c9a86a,#8c6d3a);border:none;padding:12px 40px;border-radius:99px;color:#000;font-weight:900;cursor:pointer}
.adminBox{background:rgba(0,0,0,.4);border:1px solid rgba(201,168,106,.2);border-radius:12px;padding:12px;margin-bottom:10px}
.fileInput{display:none}
.uploadLabel{background:rgba(201,168,106,.15);border:1px dashed #c9a86a;color:#c9a86a;padding:10px;border-radius:8px;display:block;text-align:center;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div id="entrance">
<div class="badge"><b>★</b><span>POLICE</span><span style="font-size:6px">SOLANO</span></div>
<div class="title">SOLANO POLICE</div>
<div class="sub">DEPARTMENT</div>
<div class="owner" id="entranceOwner">OLIVER MARSHAL<br>SYSTEM OWNER</div>
<button class="enterBtn" onclick="document.getElementById('entrance').style.opacity='0';setTimeout(()=>document.getElementById('entrance').style.display='none',600)">دخول النظام →</button>
</div>
<div id="home"><div class="wrap">
<h1 style="text-align:center;margin:10px 0;background:linear-gradient(90deg,#3a5bff,#c9a86a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:32px;font-weight:900">SOLANO POLICE</h1>
<div class="card" onclick="nav('haykala')"><div class="card-inner"><b>🏛️ نظام الهيكلة</b></div></div>
<div class="card" onclick="nav('afriqa')"><div class="card-inner"><b>⚔️ نظام الأفرقة</b></div></div>
<div class="card" onclick="nav('qawanin')"><div class="card-inner"><b>⚖️ القوانين</b></div></div>
<div style="text-align:center;margin-top:12px"><button onclick="openAdmin()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#8a94b3;padding:8px 18px;border-radius:99px;cursor:pointer">🔒 لوحة التحكم - تعديل سهل</button></div>
</div></div>
<div id="haykala" class="page"><div class="wrap"><button class="back" onclick="goBack()">← رجوع</button><h2>🏛️ الهيكلة</h2><div id="c-haykala"></div></div></div>
<div id="afriqa" class="page"><div class="wrap"><button class="back" onclick="goBack()">← رجوع</button><h2>⚔️ الأفرقة</h2><div id="c-afriqa"></div></div></div>
<div id="qawanin" class="page"><div class="wrap"><button class="back" onclick="goBack()">← رجوع</button><h2>⚖️ القوانين</h2><div id="c-qawanin"></div></div></div>
<div id="internal" class="page"><div class="wrap"><button class="back" onclick="goBack()">← رجوع</button><h2>📘 الداخلية</h2><div id="c-internal"></div></div></div>
<div id="admin" class="page"><div class="wrap"><button class="back" onclick="goBack()">← رجوع</button><h2>🔒 لوحة تحكم سهلة</h2>
<div class="adminBox"><b>🖼️ صورة الدخولية</b><input type="file" id="bgFile" class="fileInput" accept="image/*" onchange="uploadBg(event)"><label for="bgFile" class="uploadLabel">📤 اضغط لرفع صورة الخلفية من جوالك</label><div id="bgPreview" style="margin-top:8px;font-size:11px;opacity:.7"></div><button class="btn" style="background:#ff3b3b;margin-top:6px" onclick="removeBg()">🗑️ حذف الخلفية</button></div>
<div class="adminBox"><b>👑 القائد</b><input id="a_leader" class="input"><b>⭐ النواب الفيدراليون (فاصلة)</b><input id="a_fed" class="input"></div>
<div id="adminTeams"></div>
<div class="adminBox"><b>📘 القوانين الداخلية</b><div id="adminLaws"></div><button class="btn" onclick="addLaw()">➕ إضافة قانون</button></div>
<button class="btn btnGold" onclick="saveAll()">💾 حفظ كل شي</button>
</div></div>
<script>
let stack=[],current='home';
let laws=[
{title:"الصعود للطابق الثاني",text:"يمنع منعًا باتًا الصعود إلى الطابق الثاني دون إذن.",pun:"توبيخ / تحذير / فصل"},
{title:"مكتب القائد",text:"يمنع دخول مكتب القائد دون إذن.",pun:"توبيخ / تحذير / فصل"},
{title:"تواجد المجازين",text:"يمنع على المجازين البقاء أكثر من 3 دقائق.",pun:"توبيخ واحد"},
{title:"الخروج من المركز",text:"يمنع الخروج للرتب 0-1 دون مرافقة رتبة 9.",pun:"توبيخ واحد"},
{title:"السيارات الشخصية",text:"يمنع إخراج سيارة شخصية في طابق 0 دون رتبة 9.",pun:"توبيخ واحد"},
{title:"اللاسلكي",text:"يمنع استخدام الراديو للمزاح.",pun:"توبيخ واحد"},
{title:"راديو الفصائل",text:"يمنع استخدام راديو الفصائل دون رتبة 9.",pun:"توبيخ واحد"},
{title:"شات التجارة",text:"يمنع الكتابة في شات التجارة إلا للبيع.",pun:"توبيخ واحد"},
{title:"مراسلة القيادة",text:"يمنع مراسلة القائد في الخاص دون سبب.",pun:"توبيخ واحد"},
{title:"طلب الترقية",text:"يمنع طلب الترقية عبر الراديو أو الخاص.",pun:"توبيخ واحد"},
{title:"الأسلحة",text:"يمنع استخدام الصاعق بدون سبب رسمي.",pun:"توبيخ / تحذير / فصل"},
{title:"حمل السلاح",text:"يمنع حمل السلاح داخل المركز بدون سبب.",pun:"توبيخ واحد"},
{title:"الاعتداء الجسدي",text:"يمنع الاعتداء بين الضباط.",pun:"توبيخ واحد"},
{title:"الاعتقال",text:"يمنع على الرتب 0-1 اعتقال المواطنين.",pun:"توبيخ واحد"},
{title:"مخاطبة الرتب",text:"يلزم مخاطبة الرتب العليا بكلمة سيد.",pun:"توبيخ واحد"},
{title:"الرقص والأغاني",text:"يمنع الرقص أثناء الاجتماعات.",pun:"توبيخ واحد"},
{title:"المقابلات",text:"يجب حضور الرتب 5-9 وقت المقابلات.",pun:"تحذير"},
{title:"التقارير",text:"عدم إنزال التقرير الأسبوعي يوم الجمعة.",pun:"تحذير"},
{title:"التقصير",text:"التقصير في مهام الفريق لرتب 8-10.",pun:"تحذير"},
{title:"شكاوى الزملاء",text:"يمنع الشكوى بدون دليل فيديو.",pun:"توبيخ واحد"},
{title:"الأدلة",text:"أي مقطع غير واضح سيتم رفضه.",pun:"رفض"},
{title:"صلاحية المتطلبات",text:"أي متطلب يتجاوز أسبوعين سيتم رفضه.",pun:"رفض"}
];
let defaults={leader:"It's Federal",federal:["Mrr So","Abo Bandar"],teams:[
{name:"قائد الإرشاد",id:"irshad"},{name:"قائد المقابلات",id:"muqablat"},{name:"قائد الفعاليات",id:"faalyat"},{name:"قائد القوات الخاصة",id:"special"},{name:"قائد SWAT",id:"swat"},{name:"قائد PFS",id:"pfs"},{name:"قائد FTO",id:"fto"}
],afriqa:[
{name:"القوات الخاصة",intro:"وحدة النخبة"},{name:"SWAT",intro:"التدخل السريع"},{name:"FTO",intro:"التدريب"},{name:"PFS",intro:"الحماية"}
]};

function init(){let saved=JSON.parse(localStorage.getItem('solano_easy')||'null');if(saved){defaults=saved.defaults||defaults;laws=saved.laws||laws;if(saved.bg){document.getElementById('entrance').style.backgroundImage=`url('${saved.bg}')`;document.getElementById('bgPreview').innerText='✅ يوجد خلفية محفوظة';}}renderAll();}
function renderAll(){document.getElementById('c-haykala').innerHTML=`<div class="card"><div class="card-inner">👑 ${defaults.leader}</div></div>`+defaults.federal.map(f=>`<div class="card"><div class="card-inner">⭐ ${f}</div></div>`).join('')+defaults.teams.map(t=>`<div class="card"><div class="card-inner">📘 ${t.name}</div></div>`).join('');document.getElementById('c-afriqa').innerHTML=defaults.afriqa.map(a=>`<div class="card"><div class="card-inner"><b>${a.name}</b><div style="font-size:11px;opacity:.7;margin-top:4px">${a.intro}</div></div></div>`).join('');document.getElementById('c-qawanin').innerHTML=`<div class="card" onclick="nav('internal')"><div class="card-inner">📘 الداخلية - ${laws.length} قانون</div></div>`;let h='';laws.forEach((l,i)=>{h+=`<div class="card"><div class="card-inner"><div><span class="law-num">${i+1}</span><b>${l.title}</b></div><div style="margin-top:6px;opacity:.8">${l.text}</div><div style="margin-top:6px;background:rgba(255,42,42,.15);border:1px solid rgba(255,42,42,.3);color:#ff8a8a;padding:5px 8px;border-radius:6px;font-size:11px">${l.pun}</div></div></div>`});document.getElementById('c-internal').innerHTML=h;}
function nav(id){stack.push(current);current=id;document.getElementById('home').style.display='none';document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';}
function goBack(){document.querySelectorAll('.page').forEach(p=>p.style.display='none');let prev=stack.pop()||'home';current=prev;if(prev=='home')document.getElementById('home').style.display='block';else document.getElementById(prev).style.display='block';}
function openAdmin(){let p=prompt('كلمة السر:');if(btoa(p)!='T0xJVkVSMjAyNg=='){if(p)alert('خطأ');return}nav('admin');document.getElementById('a_leader').value=defaults.leader;document.getElementById('a_fed').value=defaults.federal.join(',');let tHtml='';defaults.teams.forEach((t,i)=>{tHtml+=`<div class="adminBox"><b>👤 ${t.name}</b><input id="a_team_${i}" class="input" value="${t.name}"></div>`});document.getElementById('adminTeams').innerHTML=tHtml;let lHtml='';laws.forEach((l,i)=>{lHtml+=`<div class="adminBox"><input id="l_t_${i}" class="input" placeholder="عنوان" value="${l.title}"><textarea id="l_x_${i}" class="input" placeholder="نص">${l.text}</textarea><input id="l_p_${i}" class="input" placeholder="عقوبة" value="${l.pun}"><button class="btn" style="background:#ff3b3b;padding:6px;margin-top:4px" onclick="delLaw(${i})">حذف</button></div>`});document.getElementById('adminLaws').innerHTML=lHtml;}
function uploadBg(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){let data=ev.target.result;localStorage.setItem('solano_bg_temp',data);document.getElementById('entrance').style.backgroundImage=`url('${data}')`;document.getElementById('bgPreview').innerText='✅ تم اختيار الصورة - اضغط حفظ';};reader.readAsDataURL(file);}
function removeBg(){localStorage.removeItem('solano_bg_temp');localStorage.removeItem('solano_easy_bg');document.getElementById('entrance').style.backgroundImage='';document.getElementById('bgPreview').innerText='تم الحذف';}
function addLaw(){laws.push({title:"قانون جديد",text:"نص القانون",pun:"توبيخ"});openAdmin();}
function delLaw(i){laws.splice(i,1);openAdmin();}
function saveAll(){defaults.leader=document.getElementById('a_leader').value;defaults.federal=document.getElementById('a_fed').value.split(',').map(s=>s.trim()).filter(s=>s);defaults.teams.forEach((t,i)=>{let el=document.getElementById(`a_team_${i}`);if(el)t.name=el.value});let newLaws=[];laws.forEach((_,i)=>{let t=document.getElementById(`l_t_${i}`);if(t)newLaws.push({title:t.value,text:document.getElementById(`l_x_${i}`).value,pun:document.getElementById(`l_p_${i}`).value})});laws=newLaws;let bg=localStorage.getItem('solano_bg_temp')||JSON.parse(localStorage.getItem('solano_easy')||'{}').bg||null;let toSave={defaults,laws,bg};localStorage.setItem('solano_easy',JSON.stringify(toSave));alert('تم الحفظ ✅ - كل شي صار سهل الآن');location.reload();}
init();
</script>
</body>
</html>
